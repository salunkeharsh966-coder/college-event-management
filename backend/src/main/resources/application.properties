# =====================================================================
#  Backend configuration
#  ------------------------------------------------------------------
#  IMPORTANT: change the MySQL username / password below to match
#  your own local MySQL installation before running the project.
# =====================================================================

server.port=8080

# ------------------------- MySQL connection --------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/college_event_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------- JPA / Hibernate -------------------------
# `update` means Hibernate keeps the tables in sync with the @Entity
# classes.  You still run schema.sql first to create the database and
# the clean, readable table definitions that appear in your report.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------- JSON date handling ------------------------
# Without these two lines LocalDate is serialised as [2026,11,20]
# instead of the plain "2026-11-20" string the React app expects.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --------------------------- Error handling --------------------------
# Send a proper JSON error body instead of the default Whitelabel page.
server.error.whitelabel.enabled=false

# ------------------------------ Logging ------------------------------
logging.level.root=INFO
logging.level.com.college.eventmanagement=DEBUG
